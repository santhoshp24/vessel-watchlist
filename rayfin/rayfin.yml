id: vessel-watchlist
name: vessel-watchlist
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://rural-delta-cdd7c2fc0f-centralindia.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  storage:
    enabled: false
  functions:
    enabled: false
